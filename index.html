<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALALY Super App</title>
    <!-- Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        :root {
            --primary: #00B14F;
            --primary-dark: #008D3F;
            --secondary: #FF5722;
            --accent: #FFC107;
            --bg-gray: #F5F6F8;
            --card-white: #FFFFFF;
            --text-main: #212121;
            --text-sub: #757575;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-gray);
            position: relative;
            padding-bottom: 90px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* --- Header --- */
        .header-top {
            background: linear-gradient(135deg, var(--primary) 0%, #00C853 100%);
            padding: 16px 16px 20px 16px;
            color: white;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .location-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .location-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            border: none;
            cursor: pointer;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: none;
            cursor: pointer;
        }

        .search-box {
            background: white;
            border-radius: 25px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* --- Views --- */
        .page-view {
            display: none;
            padding: 16px;
            animation: fadeIn 0.25s ease-in-out;
        }

        .page-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Services Grid --- */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .service-card {
            background: var(--card-white);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
        }

        .service-card:active {
            transform: scale(0.97);
        }

        .service-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .service-info p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .badge-tag {
            display: inline-block;
            background: #FFEBEE;
            color: var(--secondary);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
            margin-top: 4px;
        }

        .service-icon {
            font-size: 2rem;
            color: var(--primary);
        }

        /* --- Banner --- */
        .banner-slider {
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FF5722 0%, #FF9800 100%);
            color: white;
            padding: 20px;
        }

        .banner-content h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .code-tag {
            display: inline-block;
            background: white;
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* --- Food Section --- */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .food-card {
            background: white;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .food-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background-color: #EEE;
        }

        .food-details {
            padding: 10px;
        }

        .food-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .food-price {
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
            margin-top: 4px;
        }

        .add-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        /* --- Bottom Nav --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px 0;
            border-top: 1px solid #EEEEEE;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 0.75rem;
            border: none;
            background: none;
            cursor: pointer;
            width: 25%;
        }

        .nav-item i {
            font-size: 1.25rem;
            margin-bottom: 2px;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="header-top">
        <div class="location-bar">
            <button class="location-btn">
                <i class="fa-solid fa-location-dot"></i>
                <span id="user-display-name">43/9 ซอยหะยีอาหมัด...</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
            </button>
            <button class="icon-btn">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub);"></i>
            <input type="text" placeholder="ค้นหาร้านอาหาร, สินค้า หรือบริการ...">
        </div>
    </div>

    <!-- HOME VIEW -->
    <div id="home-view" class="page-view active">
        <div class="services-grid">
            <div class="service-card" onclick="switchPage('food-view')">
                <div class="service-info">
                    <h3>สั่งอาหาร</h3>
                    <p>ฮาลาลอร่อยส่งไว</p>
                    <span class="badge-tag">ลด ฿100*</span>
                </div>
                <div class="service-icon"><i class="fa-solid fa-utensils"></i></div>
            </div>

            <div class="service-card">
                <div class="service-info">
                    <h3>สั่งของ</h3>
                    <p>ของสด ครบครัน</p>
                    <span class="badge-tag">ส่งฟรี*</span>
                </div>
                <div class="service-icon"><i class="fa-solid fa-basket-shopping"></i></div>
            </div>

            <div class="service-card">
                <div class="service-info">
                    <h3>เรียกรถ</h3>
                    <p>เดินทางปลอดภัย</p>
                    <span class="badge-tag">ลด ฿100*</span>
                </div>
                <div class="service-icon"><i class="fa-solid fa-motorcycle"></i></div>
            </div>

            <div class="service-card">
                <div class="service-info">
                    <h3>เมสเซนเจอร์</h3>
                    <p>ส่งพัสดุด่วน</p>
                </div>
                <div class="service-icon"><i class="fa-solid fa-box"></i></div>
            </div>
        </div>

        <div class="banner-slider">
            <div class="banner-content">
                <p style="font-size: 0.8rem;">ร้านโค้ดเดือด</p>
                <h2>ลดสูงสุด 100.-</h2>
                <span class="code-tag">ใส่โค้ด AROI</span>
            </div>
        </div>

        <div class="section-title">
            <span>รวมดีลคุ้ม! ถูกที่สุดทุกวัน*</span>
        </div>
    </div>

    <!-- FOOD VIEW -->
    <div id="food-view" class="page-view">
        <div class="section-title">
            <span><i class="fa-solid fa-fire" style="color: var(--secondary);"></i> เมนูฮาลาลยอดนิยม</span>
            <button onclick="switchPage('home-view')" style="border:none; background:none; color:var(--primary); font-size:0.85rem; font-weight:600;">ย้อนกลับ</button>
        </div>

        <div class="food-grid">
            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=300" class="food-img" alt="Pizza">
                <div class="food-details">
                    <div class="food-title">พิซซ่าฮาลาลถาดใหญ่</div>
                    <div class="food-price">฿199</div>
                    <button class="add-btn" onclick="sendOrderToLINE('พิซซ่าฮาลาลถาดใหญ่', 199)">สั่งซื้อเลย</button>
                </div>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" class="food-img" alt="Burger">
                <div class="food-details">
                    <div class="food-title">เบอร์เกอร์เนื้อแน่น</div>
                    <div class="food-price">฿89</div>
                    <button class="add-btn" onclick="sendOrderToLINE('เบอร์เกอร์เนื้อแน่น', 89)">สั่งซื้อเลย</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home-view')">
            <i class="fa-solid fa-house"></i>
            <span>หน้าแรก</span>
        </button>
        <button class="nav-item" onclick="switchPage('food-view')">
            <i class="fa-solid fa-receipt"></i>
            <span>คำสั่งซื้อ</span>
        </button>
        <button class="nav-item">
            <i class="fa-regular fa-comment-dots"></i>
            <span>ข้อความ</span>
        </button>
        <button class="nav-item">
            <i class="fa-solid fa-ellipsis"></i>
            <span>อื่นๆ</span>
        </button>
    </div>
</div>

<script>
    const myLiffId = "2011404606-uxwIjCJT";

    // Initialize LINE LIFF
    document.addEventListener('DOMContentLoaded', function () {
        liff.init({ liffId: myLiffId })
            .then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(profile => {
                        document.getElementById('user-display-name').innerText = `คุณ ${profile.displayName}`;
                    });
                }
            })
            .catch((err) => {
                console.error('LIFF Init Failed:', err);
            });
    });

    // Switch View
    function switchPage(pageId) {
        document.querySelectorAll('.page-view').forEach(view => {
            view.classList.remove('active');
        });
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }

    // ฟังก์ชันส่งออเดอร์รูปแบบ Flex Message ใบเสร็จสุดพรีเมียม
function sendOrderToLINE(menuName, price) {
    if (typeof liff !== 'undefined' && liff.isInClient()) {
        if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: "https://halaly-app-liat.vercel.app/" });
            return;
        }

        // โครงสร้าง Flex Message รูปแบบใบเสร็จ
        const flexReceipt = {
            type: "flex",
            altText: `ใบเสร็จสั่งซื้อ: ${menuName}`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [
                        { type: "text", text: "HALALY FOOD", weight: "bold", color: "#00B14F", size: "sm" },
                        { type: "text", text: "ใบเสร็จสั่งซื้อ / RECEIPT", weight: "bold", size: "xl", margin: "xs" }
                    ]
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    contents: [
                        { type: "separator", color: "#EEEEEE" },
                        {
                            type: "box",
                            layout: "horizontal",
                            margin: "md",
                            contents: [
                                { type: "text", text: menuName, weight: "bold", size: "md", flex: 3 },
                                { type: "text", text: `฿${price}`, weight: "bold", size: "md", align: "end", flex: 1, color: "#FF5722" }
                            ]
                        },
                        { type: "separator", margin: "md", color: "#EEEEEE" },
                        {
                            type: "box",
                            layout: "horizontal",
                            margin: "md",
                            contents: [
                                { type: "text", text: "ราคารวมทั้งสิ้น", size: "sm", color: "#888888" },
                                { type: "text", text: `฿${price}`, weight: "bold", size: "lg", align: "end", color: "#00B14F" }
                            ]
                        }
                    ]
                },
                footer: {
                    type: "box",
                    layout: "vertical",
                    contents: [
                        { type: "text", text: "ขอบคุณที่อุดหนุนอาหารฮาลาลกับเราครับ! 💚", size: "xs", color: "#AAAAAA", align: "center" }
                    ]
                }
            }
        };

        // ส่ง Flex Message เข้าแชท LINE
        liff.sendMessages([flexReceipt])
            .then(() => {
                alert('ส่งใบเสร็จสั่งซื้อเข้าแชทเรียบร้อยแล้วครับ!');
                liff.closeWindow();
            })
            .catch((err) => {
                console.error('Error sending Flex Message:', err);
                alert('เกิดข้อผิดพลาดในการส่งข้อความ: ' + err.message);
            });
    } else {
        alert(`สั่งซื้อ ${menuName} ราคา ${price} บาท เรียบร้อยแล้วครับ!`);
    }
}
</script>

</body>
</html>
