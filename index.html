<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HALALY FOOD DELIVERY</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; color: #333; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; padding: 16px; }
    
    .header { text-align: center; padding: 12px 0 16px; border-bottom: 2px solid #00B900; }
    .header h1 { color: #00B900; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
    .header p { color: #666; font-size: 13px; margin-top: 2px; }

    .user-card { background: #E8F5E9; border-radius: 12px; padding: 12px 16px; margin: 16px 0; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #ccc; }
    .user-info h3 { font-size: 15px; color: #1b5e20; }
    .badge { background: #2e7d32; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

    .section-title { font-size: 16px; font-weight: bold; margin: 16px 0 10px; color: #111; }
    .shop-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .shop-info h4 { font-size: 15px; color: #222; }
    .shop-info p { font-size: 12px; color: #666; margin-top: 2px; }
    .tag-halal { background: #e8f5e9; color: #2e7d32; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    
    .btn-order { background: #00B900; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>🕌 HALALY FOOD DELIVERY</h1>
      <p>มุสลิมปรุง มุสลิมส่ง ฮาลาลเป็นธรรม 100%</p>
    </div>

    <div class="user-card">
      <img id="userImg" class="avatar" src="https://via.placeholder.com/44" alt="Profile">
      <div class="user-info">
        <h3 id="userName">กำลังเชื่อมต่อ LINE...</h3>
        <span class="badge">Halal Verified Member</span>
      </div>
    </div>

    <div class="section-title">ร้านอาหารฮาลาลแนะนำ</div>
    
    <div class="shop-card">
      <div class="shop-info">
        <h4>ข้าวหมกไก่ บารากัต <span class="tag-halal">มุสลิม 100%</span></h4>
        <p>ระยะทาง 1.2 กม. • ค่าส่งเริ่มต้น 15 บาท</p>
      </div>
      <button class="btn-order" onclick="alert('ระบบกำลังเตรียมพร้อมเปิดรับออเดอร์!')">สั่งเลย</button>
    </div>

    <div class="shop-card">
      <div class="shop-info">
        <h4>อนาโตเลีย เคบับฮาลาล <span class="tag-halal">มุสลิม 100%</span></h4>
        <p>ระยะทาง 2.5 กม. • ค่าส่งเริ่มต้น 20 บาท</p>
      </div>
      <button class="btn-order" onclick="alert('ระบบกำลังเตรียมพร้อมเปิดรับออเดอร์!')">สั่งเลย</button>
    </div>
  </div>

  <script>
    async function initHalaly() {
      try {
        await liff.init({ liffId: "2011322353-JNg70x68" });

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          document.getElementById("userName").innerText = profile.displayName;
          if (profile.pictureUrl) {
            document.getElementById("userImg").src = profile.pictureUrl;
          }
        } else {
          liff.login();
        }
      } catch (err) {
        console.error("LIFF Error:", err);
        document.getElementById("userName").innerText = "เปิดผ่านแอป LINE เพื่อใช้งาน";
      }
    }
    initHalaly();
  </script>
</body>
</html>
